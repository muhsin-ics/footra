<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Product Details</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
<style>
body{
    font-family: Arial;
    margin:0;
    padding:40px;
    background:#f5f5f5;
}

/* ---------- CONTAINER ---------- */
.product-container{
    display:flex;
    gap:50px;
    background:white;
    padding:40px;
    border-radius:15px;
    align-items:center;
}

/* ---------- IMAGE ---------- */
.product-image img{
    width:100%;
    max-width:400px;
    border-radius:15px;
}

/* ---------- DETAILS ---------- */
.product-details{
    flex:1;
}

.price{
    font-size:24px;
    color:darkred;
    font-weight:bold;
    margin-bottom:15px;
}

/* ---------- SIZE BUTTONS ---------- */
.size-options{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.size-options button{
    padding:10px 15px;
    border:1px solid #ccc;
    background:white;
    cursor:pointer;
    border-radius:6px;
}

.size-options button.active{
    background:black;
    color:white;
}

/* ---------- PAYMENT ICONS ---------- */
.product-details i{
    font-size:28px;
    margin-right:15px;
    margin-top:10px;
}

/* ---------- CHECKOUT ---------- */
.checkout-btn{
    margin-top:25px;
    padding:15px 30px;
    border:none;
    background:black;
    color:white;
    cursor:pointer;
    border-radius:30px;
    width:fit-content;
}

/* ---------- TOP BAR ---------- */
.top-bar{
    margin-bottom:25px;
}

.back-btn{
    background:none;
    border:none;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    color:#333;
    display:flex;
    align-items:center;
    gap:8px;
    transition:0.3s;
}

.back-btn:hover{
    color:darkred;
}

/* ============================= */
/* 🔥 RESPONSIVE SECTION */
/* ============================= */

@media (max-width: 992px){
    body{
        padding:20px;
    }

    .product-container{
        gap:30px;
        padding:25px;
    }
}

@media (max-width: 768px){
    .product-container{
        flex-direction:column;
        text-align:center;
    }

    .product-image img{
        max-width:300px;
    }

    .checkout-btn{
        width:100%;
    }

    .size-options{
        justify-content:center;
    }
}

@media (max-width: 480px){
    body{
        padding:15px;
    }

    .product-container{
        padding:20px;
        border-radius:10px;
    }

    .product-image img{
        max-width:250px;
    }

    .price{
        font-size:20px;
    }
}
</style>
</head>
<body>
    <div class="top-bar">
    <button class="back-btn" onclick="goBack()">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
    </button>
</div>

<div class="product-container">
    <div class="product-image">
        <img id="productImage">
    </div>

    <div class="product-details">
        <h1 id="productName"></h1>
        <div class="price" id="productPrice"></div>

        <p>
            Crafted from premium leather, built for durability,
            comfort and timeless style.
        </p>

        <h3>Select Size</h3>
        <div class="size-options">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>10</button>
        </div>

        <h3>Payment Methods</h3>
        <div>
            <i class="fa-brands fa-cc-visa"></i>
            <i class="fa-brands fa-cc-mastercard"></i>
            <i class="fa-brands fa-cc-paypal"></i>
            <i class="fa-brands fa-google-pay"></i>
        </div>

        <button class="checkout-btn">Checkout</button>
    </div>
</div>

<script>
const product = JSON.parse(localStorage.getItem("selectedProduct"));

let selectedSize = null;

if(product){
    document.getElementById("productName").innerText = product.name;
    document.getElementById("productPrice").innerText = product.price;
    document.getElementById("productImage").src = product.image;
}

// Size selection
document.querySelectorAll(".size-options button").forEach(btn=>{
    btn.addEventListener("click",function(){
        document.querySelectorAll(".size-options button")
        .forEach(b=>b.classList.remove("active"));

        this.classList.add("active");
        selectedSize = this.innerText;
    });
});

// Checkout button
document.querySelector(".checkout-btn").addEventListener("click", function(){

    if(!selectedSize){
        alert("Please select a size first.");
        return;
    }

    const checkoutData = {
        name: product.name,
        price: product.price,
        image: product.image,
        size: selectedSize
    };

    localStorage.setItem("checkoutProduct", JSON.stringify(checkoutData));

    window.location.href = "checkout.html";
});

function goBack(){
    window.location.href = "index.html"; 
}
</script>

</body>
</html>
