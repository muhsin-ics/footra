<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Product Details</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="mystyle.css">
</head>
<body>
    <div class="top-bar">
    <button class="back-btn" onclick="goBack()">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
    </button>
</div>

<div class="product-container">
    <div class="product-image">
        <img id="productImage">
    </div>

    <div class="product-details">
        <h1 id="productName"></h1>
        <div class="price" id="productPrice"></div>

        <p>
            Crafted from premium leather, built for durability,
            comfort and timeless style.
        </p>

        <h3>Select Size</h3>
        <div class="size-options">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>10</button>
        </div>

        <h3>Payment Methods</h3>
        <div>
            <i class="fa-brands fa-cc-visa"></i>
            <i class="fa-brands fa-cc-mastercard"></i>
            <i class="fa-brands fa-cc-paypal"></i>
            <i class="fa-brands fa-google-pay"></i>
        </div>

        <button class="checkout-btn">Checkout</button>
    </div>
</div>

<script>
const product = JSON.parse(localStorage.getItem("selectedProduct"));

let selectedSize = null;

if(product){
    document.getElementById("productName").innerText = product.name;
    document.getElementById("productPrice").innerText = product.price;
    document.getElementById("productImage").src = product.image;
}

// Size selection
document.querySelectorAll(".size-options button").forEach(btn=>{
    btn.addEventListener("click",function(){
        document.querySelectorAll(".size-options button")
        .forEach(b=>b.classList.remove("active"));

        this.classList.add("active");
        selectedSize = this.innerText;
    });
});

// Checkout button
document.querySelector(".checkout-btn").addEventListener("click", function(){

    if(!selectedSize){
        alert("Please select a size first.");
        return;
    }

    const checkoutData = {
        name: product.name,
        price: product.price,
        image: product.image,
        size: selectedSize
    };

    localStorage.setItem("checkoutProduct", JSON.stringify(checkoutData));

    window.location.href = "checkout.html";
});

function goBack(){
    window.location.href = "index.html"; 
}
</script>

</body>
</html>
