<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Checkout</title>
<style>
body{
    font-family: Arial;
    background:#f5f5f5;
    padding:40px;
}

.checkout-container{
    display:flex;
    gap:50px;
}

.form-section{
    flex:2;
    background:white;
    padding:30px;
    border-radius:10px;
}

.summary-section{
    flex:1.2;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 8px 25px rgba(0,0,0,0.08);
    height:fit-content;
}

.summary-section h3{
    margin-bottom:25px;
    font-size:22px;
}

.summary-product{
    display:flex;
    gap:20px;
    align-items:center;
    margin-bottom:25px;
}

.summary-product img{
    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:10px;
}

.summary-details p{
    margin:6px 0;
    font-size:15px;
}

.summary-price{
    font-size:20px;
    font-weight:bold;
    margin-top:10px;
}

.summary-divider{
    height:1px;
    background:#eee;
    margin:25px 0;
}

.summary-total{
    display:flex;
    justify-content:space-between;
    font-size:18px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:15px;
    background:#007bff;
    color:white;
    border:none;
    cursor:pointer;
}

.top-bar{
    margin-bottom:25px;
}

.back-btn{
    background:none;
    border:none;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    color:#333;
    transition:0.3s;
}

.back-btn:hover{
    color:darkred;
}

/* ===== RESPONSIVE DESIGN ===== */

@media (max-width: 992px){
    .checkout-container{
        flex-direction: column;
    }

    .summary-section{
        padding:30px;
    }
}

@media (max-width: 768px){

    body{
        padding:20px;
    }

    .checkout-container{
        flex-direction: column;
        gap:25px;
    }

    .form-section,
    .summary-section{
        padding:20px;
        border-radius:12px;
    }

    .summary-product{
        flex-direction: column;
        align-items:flex-start;
    }

    .summary-product img{
        width:100%;
        height:auto;
    }

    h2{
        font-size:20px;
    }

    button{
        padding:14px;
        font-size:15px;
    }
}

@media (max-width: 480px){

    body{
        padding:15px;
    }

    .form-section,
    .summary-section{
        padding:15px;
    }

    input{
        padding:12px;
        font-size:14px;
    }

    .summary-total{
        font-size:16px;
    }
}
</style>
</head>
<body>

    <div class="top-bar">
    <button class="back-btn" onclick="goBackToProduct()">
        ← Back to Product
    </button>
</div>

<div class="checkout-container">

<form class="form-section" id="checkoutForm">

<h2>Contact</h2>
<input type="email" id="email" placeholder="Email">

<h2>Delivery</h2>
<input type="text" id="fullname" placeholder="Full Name">
<input type="text" id="address" placeholder="Address">
<input type="text" id="city" placeholder="City">
<input type="text" id="pincode" placeholder="PIN Code">
<input type="text" id="phone" placeholder="Phone">

<h2>Payment</h2>
<p>All transactions are secure and encrypted.</p>

<button type="submit">Pay Now</button>

</form>

<div class="summary-section">
    <h3>Order Summary</h3>

    <div class="summary-product">
        <img id="summaryImage">
        <div class="summary-details">
            <p id="summaryName"></p>
            <p id="summarySize"></p>
            <div class="summary-price" id="summaryPrice"></div>
        </div>
    </div>

    <div class="summary-divider"></div>

    <div class="summary-total">
        <span>Total</span>
        <span id="summaryTotal"></span>
    </div>
</div>

</div>

<script>
document.getElementById("checkoutForm").addEventListener("submit", function(e){

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const fullname = document.getElementById("fullname").value.trim();
    const address = document.getElementById("address").value.trim();
    const city = document.getElementById("city").value.trim();
    const pincode = document.getElementById("pincode").value.trim();
    const phone = document.getElementById("phone").value.trim();

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const namePattern = /^[A-Za-z ]+$/;
    const phonePattern = /^[0-9]{10}$/;
    const pinPattern = /^[0-9]{6}$/;

    if(!email || !fullname || !address || !city || !pincode || !phone){
        alert("Please fill all fields.");
        return;
    }

    if(!emailPattern.test(email)){
        alert("Please enter a valid email address.");
        return;
    }

    if(!namePattern.test(fullname)){
        alert("Full name should contain letters only.");
        return;
    }

    if(!pinPattern.test(pincode)){
        alert("PIN Code must be 6 digits.");
        return;
    }

    if(!phonePattern.test(phone)){
        alert("Phone number must be 10 digits.");
        return;
    }

    alert("Payment Successful! 🎉");
});
function goBackToProduct(){
    window.history.back();
}

const data = JSON.parse(localStorage.getItem("checkoutProduct"));

if(data){
    document.getElementById("summaryImage").src = data.image;
    document.getElementById("summaryName").innerText = data.name;
    document.getElementById("summarySize").innerText = "Size: " + data.size;
    document.getElementById("summaryPrice").innerText = data.price;
    document.getElementById("summaryTotal").innerText = data.price;
}
</script>

</body>
</html>
