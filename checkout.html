<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Checkout</title>
<link rel="stylesheet" type="text/css" href="mystyle.css">
</head>
<body>

    <div class="top-bar">
    <button class="back-btn" onclick="goBackToProduct()">
        ← Back to Product
    </button>
</div>

<div class="checkout-container">

<form class="form-section" id="checkoutForm">

<h2>Contact</h2>
<input type="email" id="email" placeholder="Email">

<h2>Delivery</h2>
<input type="text" id="fullname" placeholder="Full Name">
<input type="text" id="address" placeholder="Address">
<input type="text" id="city" placeholder="City">
<input type="text" id="pincode" placeholder="PIN Code">
<input type="text" id="phone" placeholder="Phone">

<h2>Payment</h2>
<p>All transactions are secure and encrypted.</p>

<button type="submit">Pay Now</button>

</form>

<div class="summary-section">
    <h3>Order Summary</h3>

    <div class="summary-product">
        <img id="summaryImage">
        <div class="summary-details">
            <p id="summaryName"></p>
            <p id="summarySize"></p>
            <div class="summary-price" id="summaryPrice"></div>
        </div>
    </div>

    <div class="summary-divider"></div>

    <div class="summary-total">
        <span>Total</span>
        <span id="summaryTotal"></span>
    </div>
</div>

</div>

<script>
document.getElementById("checkoutForm").addEventListener("submit", function(e){

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const fullname = document.getElementById("fullname").value.trim();
    const address = document.getElementById("address").value.trim();
    const city = document.getElementById("city").value.trim();
    const pincode = document.getElementById("pincode").value.trim();
    const phone = document.getElementById("phone").value.trim();

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const namePattern = /^[A-Za-z ]+$/;
    const phonePattern = /^[0-9]{10}$/;
    const pinPattern = /^[0-9]{6}$/;

    if(!email || !fullname || !address || !city || !pincode || !phone){
        alert("Please fill all fields.");
        return;
    }

    if(!emailPattern.test(email)){
        alert("Please enter a valid email address.");
        return;
    }

    if(!namePattern.test(fullname)){
        alert("Full name should contain letters only.");
        return;
    }

    if(!pinPattern.test(pincode)){
        alert("PIN Code must be 6 digits.");
        return;
    }

    if(!phonePattern.test(phone)){
        alert("Phone number must be 10 digits.");
        return;
    }

    alert("Payment Successful! 🎉");
});
function goBackToProduct(){
    window.history.back();
}

const data = JSON.parse(localStorage.getItem("checkoutProduct"));

if(data){
    document.getElementById("summaryImage").src = data.image;
    document.getElementById("summaryName").innerText = data.name;
    document.getElementById("summarySize").innerText = "Size: " + data.size;
    document.getElementById("summaryPrice").innerText = data.price;
    document.getElementById("summaryTotal").innerText = data.price;
}
</script>

</body>
</html>
